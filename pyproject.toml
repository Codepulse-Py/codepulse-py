[project]
name = "codepulse-py"
version = "0.1.0"
description = "Real-time misconception detection and adaptive intervention for introductory Python."
readme = "README.md"
requires-python = ">=3.11,<3.12"
license = { text = "MIT" }

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["backend*", "detectors*", "features*", "models*"]

[tool.ruff]
target-version = "py311"
line-length = 100
extend-exclude = ["data"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
pythonpath = ["."]
